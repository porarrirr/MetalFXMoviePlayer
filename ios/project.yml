name: MovieFXPlayerIOS
options:
  bundleIdPrefix: com.porari
targets:
  MovieFXPlayerIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MovieFXPlayerIOS
        excludes:
          - Info.plist
      - path: ../Sources/MovieFXPlayer/MetalFXRenderer.swift
      - path: ../Sources/MovieFXPlayer/VideoPlayer.swift
    info:
      path: MovieFXPlayerIOS/Info.plist
      properties:
        CFBundleDisplayName: MovieFX Player
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Movie
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - public.movie
              - public.video
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.porari.MovieFXPlayerIOS
        PRODUCT_NAME: MovieFXPlayer
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
